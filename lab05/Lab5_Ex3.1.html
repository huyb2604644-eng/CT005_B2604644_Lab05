<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ cá nhân | Portfolio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172d32;
      --muted: #5e7072;
      --accent: #c45437;
      --accent-dark: #913c29;
      --paper: #f2f0e9;
      --surface: #fffefa;
      --line: #e6e2d8;
      --shadow: 0 18px 45px rgba(35, 49, 46, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 48px 20px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      line-height: 1.6;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d9d4c8 0.7px, transparent 0.7px);
      background-size: 18px 18px;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
    }

    .intro {
      position: relative;
      overflow: hidden;
      margin-bottom: 26px;
      padding: clamp(28px, 6vw, 58px);
      color: #fffefa;
      background: var(--ink);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .intro::after {
      position: absolute;
      right: -42px;
      bottom: -100px;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 28px rgba(255, 255, 255, 0.04), 0 0 0 58px rgba(255, 255, 255, 0.035);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #f0a58f;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      max-width: 680px;
      margin-bottom: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 3.5rem;
      font-weight: 500;
      line-height: 1.08;
    }

    .intro p:last-child {
      max-width: 570px;
      margin-bottom: 0;
      color: #d4dfdc;
      font-size: 1.05rem;
    }

    .content-section {
      margin-bottom: 20px;
      padding: clamp(22px, 4vw, 36px);
      background: var(--surface);
      border: 1px solid rgba(230, 226, 216, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-number {
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h2 {
      margin-bottom: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.8rem;
      font-weight: 500;
    }

    .document-frame {
      display: block;
      width: 100%;
      height: 500px;
      background: #f1f1ed;
      border: 1px solid var(--line);
      border-radius: 5px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      border-radius: 5px;
    }

    .video {
      position: relative;
      width: 100%;
      overflow: hidden;
      padding-bottom: 56.25%;
      background: #172d32;
      border-radius: 5px;
    }

    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      padding: 18px 4px 0;
      border-top: 1px solid #c9c5bb;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      body { padding: 22px 14px; }
      .intro { margin-bottom: 16px; }
      .content-section { margin-bottom: 14px; }
      .document-frame { height: 500px; }
      h1 { font-size: 2.3rem; }
      h2 { font-size: 1.45rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <p class="eyebrow">Hồ sơ cá nhân</p>
      <h1>Xin chào, tôi là Triẹu gia huy</h1>
      <p>Tôi luôn sẵn sàng học hỏi, sáng tạo và chia sẻ những điều mình khám phá.</p>
    </header>

    <section class="content-section" aria-labelledby="document-title">
      <div class="section-heading">
        <span class="section-number">01</span>
        <h2 id="document-title">Tài liệu</h2>
      </div>
      <embed class="document-frame" src="Lab05_Ex1.2.png" type="image/png" title="Tài liệu PNG cá nhân">
    </section>

    <section class="content-section" aria-labelledby="infographic-title">
      <div class="section-heading">
        <span class="section-number">02</span>
        <h2 id="infographic-title">Infographic</h2>
      </div>
      <img src="Lab05_Ex2.1.png" alt="Infographic giới thiệu nội dung bài tập">
    </section>

    <section class="content-section" aria-labelledby="video-title">
      <div class="section-heading">
        <span class="section-number">03</span>
        <h2 id="video-title">Video</h2>
      </div>
      <div class="video">
        <iframe
          src="https://www.youtube.com/embed/bxtLa48QVrk"
          title="Video YouTube – Nhiệm vụ 2.2"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <footer>
      © 2026. Infographic và nội dung được sử dụng cho mục đích học tập.
    </footer>
  </main>
</body>
</html>
